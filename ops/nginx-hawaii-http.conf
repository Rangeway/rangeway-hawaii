server {
    listen 80;
    listen [::]:80;
    server_name hawaii.rangeway.co;

    root /var/www/rangeway-hawaii;
    include snippets/rangeway-static.conf;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
