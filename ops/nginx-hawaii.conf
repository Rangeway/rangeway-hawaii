server {
    listen 80;
    listen [::]:80;
    server_name hawaii.rangeway.co;

    root /var/www/rangeway-hawaii;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://hawaii.rangeway.co$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hawaii.rangeway.co;

    root /var/www/rangeway-hawaii;
    include snippets/rangeway-static.conf;

    location / {
        try_files $uri $uri/ =404;
    }

    ssl_certificate /etc/letsencrypt/live/hawaii.rangeway.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hawaii.rangeway.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
