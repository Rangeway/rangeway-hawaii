<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
    body {
      position: relative;
      color: #fff8ea;
      background: #102b3a url("../source-assets/hawaii-basecamp-phase1-1.png") center / cover no-repeat;
      font-family: "Raleway", sans-serif;
    }
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgb(10 32 44 / 96%) 0 36%, rgb(10 32 44 / 65%) 53%, rgb(10 32 44 / 8%) 80%);
    }
    body::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 14px solid #f4a640;
      pointer-events: none;
    }
    .content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 58px 64px 56px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 29px;
      font-weight: 700;
    }
    .mark {
      position: relative;
      width: 32px;
      height: 42px;
      border: 5px solid currentColor;
      border-right: 0;
      border-radius: 8px 0 0 0;
    }
    .mark::after {
      content: "";
      position: absolute;
      top: 8px;
      right: -12px;
      width: 18px;
      height: 18px;
      border: 5px solid currentColor;
      border-left: 0;
      border-radius: 0 9px 9px 0;
    }
    .mark span {
      position: absolute;
      top: 11px;
      right: -7px;
      z-index: 2;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f4a640;
    }
    .copy {
      max-width: 720px;
    }
    .eyebrow {
      margin: 0 0 18px;
      color: #f7c96d;
      font-family: "Source Code Pro", monospace;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 {
      max-width: 680px;
      margin: 0;
      font-size: 82px;
      font-weight: 900;
      letter-spacing: -.06em;
      line-height: .88;
    }
    p {
      margin: 23px 0 0;
      font-family: "Source Sans 3", sans-serif;
      font-size: 26px;
      line-height: 1.24;
    }
  </style>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@700;900&family=Source+Code+Pro:wght@600&family=Source+Sans+3:wght@500&display=swap" />
</head>
<body>
  <div class="content">
    <div class="brand"><span class="mark"><span></span></span>Rangeway</div>
    <div class="copy">
      <p class="eyebrow">A better kind of stop</p>
      <h1>Rangeway<br />Hawaiʻi Island</h1>
      <p>Hospitality, road travel, and resilient energy.</p>
    </div>
  </div>
</body>
</html>
