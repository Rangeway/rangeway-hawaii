name: Publish for VPS pull-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hawaii
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish site to deploy-dist branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rsync -a --delete \
            --exclude='.git' --exclude='.github' --exclude='.DS_Store' \
            --exclude='.gitignore' --exclude='README.md' --exclude='DEPLOY.md' \
            --exclude='SOURCE_ASSETS.md' --exclude='CONTENT_SOURCES.md' --exclude='source-assets' --exclude='tests' \
            --exclude='tools' --exclude='ops' --exclude='package.json' --exclude='CNAME' \
            ./ /tmp/site-dist/
          cd /tmp/site-dist
          git init -q -b deploy-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy-dist
